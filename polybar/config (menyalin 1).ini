[colors]
background     = #FFFFFF
background-alt = #F4F4F4
foreground     = #1A1A1A
foreground-alt = #888888
primary        = #294172
border         = #E0E0E0
red            = #D32F2F
blue           = #294172

[bar/main]
# --- POSISI FLOATING PRESISI DI TENGAH (TOP) ---
top = true
width = 98%
height = 24pt
offset-x = 1%
offset-y = 8pt
radius = 10

# Agar melayang tepat di atas jendela bspwm
override-redirect = false
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
border-size = 1pt
border-color = ${colors.border}

# Spasial & Margin Simetris
padding-left = 2
padding-right = 2
module-margin = 2

# ------------------------------------------------------------------------------
# DEFINISI FONT PRESISI
# ------------------------------------------------------------------------------
# font-0 (Indeks 1) -> Khusus Teks Tampilan (Size 10)
font-0 = "JetBrainsMono Nerd Font:style=Bold:size=10;3"

# font-1 (Indeks 2) -> Khusus Ikon Standar (Size 13)
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=13;3"

# font-2 (Indeks 3) -> KHUSUS IKON POWER (Size 15 agar seukuran secara visual)
font-2 = "JetBrainsMono Nerd Font:style=Bold:size=15;3"

# font-3 (Indeks 4) -> Fallback Font Awesome Brands
font-3 = "Font Awesome 6 Brands:size=10;3"

modules-left = menu bspwm
modules-center = date
modules-right = pulseaudio network power

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

# ------------------------------------------------------------------------------
# MODULES LEFT
# ------------------------------------------------------------------------------

[module/menu]
type = custom/text
label = "%{T3}%{T-}"
label-foreground = ${colors.primary}
click-left = rofi -show apps -modi "apps:~/.config/rofi/apps-menu.sh" -theme ~/.config/rofi/apps-popup.rasi

[module/bspwm]
type = internal/bspwm

label-focused = %name%
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.primary}
label-focused-padding = 2

label-occupied = %name%
label-occupied-padding = 2
label-occupied-foreground = ${colors.foreground}

label-urgent = %name%
label-urgent-background = #FFD1D1
label-urgent-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.foreground-alt}
label-empty-padding = 2

# ------------------------------------------------------------------------------
# MODULES CENTER
# ------------------------------------------------------------------------------

[module/date]
type = internal/date
interval = 1
date = "%{T2}󱑏%{T-} %a, %d %b %H:%M"
label = %date%
label-foreground = ${colors.foreground}

# ------------------------------------------------------------------------------
# MODULES RIGHT
# ------------------------------------------------------------------------------

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume>

format-muted = <label-muted>
label-muted = "%{T2}󰝟%{T-} Muted"
label-muted-foreground = ${colors.foreground-alt}

ramp-volume-0 = "%{T2}󰕿%{T-}"
ramp-volume-1 = "%{T2}󰖀%{T-}"
ramp-volume-2 = "%{T2}󰕾%{T-}"
ramp-volume-foreground = ${colors.primary}

[module/network]
type = internal/network
interface = enp3s0
interval = 3.0

format-connected = <label-connected>
label-connected = "%{T1}󰤨%{T-}"
label-connected-foreground = ${colors.blue}

format-disconnected = <label-disconnected>
label-disconnected = "%{T1}󰤭%{T-} Offline"
label-disconnected-foreground = ${colors.foreground-alt}

[module/power]
type = custom/text
# Menggunakan %{T2} agar mendongkrak ukuran ikon power ke font-2 (Size 15)
label = "%{T2}󰐥%{T-}"
label-foreground = ${colors.blue}
click-left = rofi -show power-menu -modi "power-menu:~/.config/rofi/powermenu.sh" -theme ~/.config/rofi/powermenu.rasi