[colors]
background     = #FFFFFF
background-alt = #F4F4F4
foreground     = #294172
foreground-alt = #888888
primary        = #294172
# Warna border biru tua yang senada dengan border window BSPWM
border-color   = #294172
red            = #D32F2F

[bar/main]
wm-restack = bspwm
bottom = true
width = 1896px
height = 24pt
offset-x = 12px
offset-y = 8pt
radius = 8

override-redirect = false
fixed-center = true

background = ${colors.background}
foreground = ${colors.primary}

# BORDER LUAR POLYBAR (Eksplisit 4 sisi agar serasi dengan window aplikasi)
border-top-size = 2pt
border-bottom-size = 2pt
border-left-size = 2pt
border-right-size = 2pt
border-color = ${colors.border-color}

padding-left = 2
padding-right = 2
module-margin = 1

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=10;2"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=12;2"
font-2 = "JetBrainsMono Nerd Font:style=Bold:size=15;2"
font-3 = "Font Awesome 6 Brands:size=10;2"

modules-left = menu bspwm
modules-center = weather date
modules-right = cpu memory pulseaudio network power

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

# ------------------------------------------------------------------------------
# MODULES LEFT
# ------------------------------------------------------------------------------

[module/menu]
type = custom/text
label = "%{T3}%{T-}"
label-foreground = ${colors.primary}
label-padding = 1
click-left = rofi -show apps -modi "apps:~/.config/rofi/apps-menu.sh" -theme ~/.config/rofi/apps-popup.rasi

[module/bspwm]
type = internal/bspwm

label-focused = "%{T1} %name% %{T-}"
label-focused-background = ${colors.background-alt}
label-focused-foreground = ${colors.primary}
label-focused-padding = 1

label-occupied = "%{T1} %name% %{T-}"
label-occupied-foreground = ${colors.primary}
label-occupied-padding = 1

label-urgent = "%{T1} %name% %{T-}"
label-urgent-background = #FFD1D1
label-urgent-foreground = ${colors.red}
label-urgent-padding = 1

label-empty = "%{T1} %name% %{T-}"
label-empty-foreground = ${colors.foreground-alt}
label-empty-padding = 1

# ------------------------------------------------------------------------------
# MODULES CENTER
# ------------------------------------------------------------------------------

[module/weather]
type = custom/script
exec = ~/.config/polybar/weather.sh
interval = 600
label = "%{T1}%output%%{T-}"
label-foreground = ${colors.primary}
label-padding-right = 0
label-margin-right = 0

[module/date]
type = internal/date
interval = 1.0
date = "%{T1}%A, %H:%M %p%{T-}"
label = " | %date%"
label-foreground = ${colors.primary}             
label-padding-left = 0
label-margin-left = 0

# ------------------------------------------------------------------------------
# MODULES RIGHT
# ------------------------------------------------------------------------------

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
label = "%{T2}󰻠%{T-} %percentage%%"
label-foreground = ${colors.primary}
label-padding = 1

[module/memory]
type = internal/memory
interval = 2
format = <label>
label = "%{T2}󰍛%{T-} %percentage_used%%"
label-foreground = ${colors.primary}
label-padding = 1

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume>
format-volume-padding = 1

format-muted = <label-muted>
format-muted-padding = 1
label-muted = "%{T2}󰝟%{T-} Muted"
label-muted-foreground = ${colors.foreground-alt}

ramp-volume-0 = "%{T2}󰕿%{T-}"
ramp-volume-1 = "%{T2}󰖀%{T-}"
ramp-volume-2 = "%{T2}󰕾%{T-}"
ramp-volume-foreground = ${colors.primary}

[module/network]
type = internal/network
interface = enp3s0
interval = 3.0

format-connected = <label-connected>
format-connected-padding = 1
label-connected = "%{T1}󰤨%{T-}"
label-connected-foreground = ${colors.primary}

format-disconnected = <label-disconnected>
format-disconnected-padding = 1
label-disconnected = "%{T1}󰤭%{T-} Offline"
label-disconnected-foreground = ${colors.foreground-alt}

[module/power]
type = custom/text
label = "%{T2}󰐥%{T-}"
label-foreground = ${colors.primary}
label-padding = 1
click-left = rofi -show power-menu -modi "power-menu:~/.config/rofi/powermenu.sh" -theme ~/.config/rofi/powermenu.rasi