#################################
#             Backend           #
#################################
backend = "glx";
vsync = true;

#################################
#          Corners (Sudut)      #
#################################
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'desktop'",
  "class_g = 'Polybar'"
  # 'dock' dihapus dari daftar exclude agar Plank menggunakan sudut rounded dari theme
];

#################################
#        Shadows (Bayangan)     #
#################################
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.12;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-color = "#000000";

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#        Fading (Transisi)      #
#################################
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;

#################################
#      Opacity & Transparansi   #
#################################
active-opacity = 1.0;
inactive-opacity = 0.96;
frame-opacity = 1.0;

opacity-rule = [
  "80:class_g = 'Conky'"
];

focus-exclude = [
  "class_g = 'Rofi'",
  "class_g = 'Conky'"
];

#################################
#        General Settings       #
#################################
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
log-level = "warn";

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = false; }
  dmenu = { shadow = false; }
  popup_menu = { opacity = 0.98; shadow = true; }
  dropdown_menu = { opacity = 0.98; shadow = true; };
};